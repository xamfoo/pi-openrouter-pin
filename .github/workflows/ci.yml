name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi: ["0.84.1", "0.85.1", "0.86.1"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm install --no-save "@earendil-works/pi-coding-agent@${{ matrix.pi }}" "@earendil-works/pi-tui@${{ matrix.pi }}"

      - run: npm test
