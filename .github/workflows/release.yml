name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm ci
      - name: Publish to npm
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PKG_NAME="$(node -p "require('./package.json').name")"
          if [[ "$PKG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\+.*)?$ ]]; then
            CURRENT_LATEST="$(npm view "$PKG_NAME" dist-tags.latest 2>/dev/null || true)"
            if [ -z "$CURRENT_LATEST" ] || [ "$(printf '%s\n' "$CURRENT_LATEST" "$PKG_VERSION" | sort -V | tail -n1)" = "$PKG_VERSION" ]; then
              echo "Publishing release $PKG_VERSION to latest"
              npm publish --provenance --access public
            else
              echo "Publishing release $PKG_VERSION (older than latest $CURRENT_LATEST) to next"
              npm publish --provenance --access public --tag next
            fi
          else
            echo "Publishing prerelease $PKG_VERSION to next"
            npm publish --provenance --access public --tag next
          fi

  release:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Tag version
        id: tag
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          PKG_VERSION="${VERSION#v}"
          if [[ "$PKG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\+.*)?$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          if ! git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            git tag "$VERSION"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          prerelease: ${{ steps.tag.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
