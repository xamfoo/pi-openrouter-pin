name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm ci
      - name: Pack tarball for e2e
        run: |
          TARBALL="$(npm pack --json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8'))[0].filename")"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          ls -lh "$TARBALL"
      - uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: ${{ env.TARBALL }}
          retention-days: 7
      - name: Publish to npm
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PKG_NAME="$(node -p "require('./package.json').name")"
          if [[ "$PKG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\+.*)?$ ]]; then
            CURRENT_LATEST="$(npm view "$PKG_NAME" dist-tags.latest 2>/dev/null || true)"
            if [ -z "$CURRENT_LATEST" ] || [ "$(printf '%s\n' "$CURRENT_LATEST" "$PKG_VERSION" | sort -V | tail -n1)" = "$PKG_VERSION" ]; then
              echo "Publishing release $PKG_VERSION to latest"
              npm publish --provenance --access public
            else
              echo "Publishing release $PKG_VERSION (older than latest $CURRENT_LATEST) to next"
              npm publish --provenance --access public --tag next
            fi
          else
            echo "Publishing prerelease $PKG_VERSION to next"
            npm publish --provenance --access public --tag next
          fi

  release:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v6
        with:
          # Check out as the app
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true
          # Don't persist the default GITHUB_TOKEN in the local git config
          persist-credentials: false
      - name: Prepare GitHub release parameters
        id: params
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          PKG_VERSION="${VERSION#v}"
          if [[ "$PKG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\+.*)?$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Use the app token
          token: ${{ steps.generate-token.outputs.token }}
          tag_name: ${{ steps.params.outputs.version }}
          prerelease: ${{ steps.params.outputs.is_prerelease == 'true' }}
          generate_release_notes: true

  # End-to-end suite against the PUBLISHED package: installs the tarball artifact
  # from the publish job, loads it through pi's real extension loader
  # (package.json pi.extensions → jiti), and drives real OpenRouter endpoints.
  # Gated by CI_E2E=1 (see test/e2e.test.ts); requires the npm-publish
  # environment secret OPENROUTER_API_KEY.
  e2e:
    runs-on: ubuntu-latest
    needs: publish
    environment: npm-publish
    permissions:
      contents: read
    env:
      CI_E2E: "1"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
      - uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: ${{ runner.temp }}/orpin-tarball
      - run: npm ci
      - name: Install pi and the tarball pin into an isolated prefix
        run: |
          DEPS_DIR="$RUNNER_TEMP/orpin-e2e-deps"
          TARBALL_DIR="$RUNNER_TEMP/orpin-tarball"
          mkdir -p "$DEPS_DIR"
          cd "$DEPS_DIR"
          # A separate prefix: the repo IS @xamfoo/pi-openrouter-pin, so npm
          # refuses to install the same name into its own node_modules.
          npm init -y >/dev/null
          TARBALL="$(ls "$TARBALL_DIR"/*.tgz 2>/dev/null | head -n1)"
          if [ -z "$TARBALL" ]; then
            echo "No .tgz found in $TARBALL_DIR" >&2
            ls -R "$TARBALL_DIR" >&2 || true
            exit 1
          fi
          echo "Installing pin from tarball: $TARBALL"
          ls -lh "$TARBALL"
          npm install --no-audit --no-fund "@earendil-works/pi-coding-agent@latest" "$TARBALL"
          echo "ORPIN_PKG_DIR=$DEPS_DIR/node_modules/@xamfoo/pi-openrouter-pin" >> "$GITHUB_ENV"
      - name: Run the end-to-end suite (published package through pi's loader)
        run: npm test
